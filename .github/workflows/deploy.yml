name: Deploy Backend to Hostinger VPS

on:
  push:
    branches:
      - master
    paths:
      - 'server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            export TARGET_DIR="/var/www/ssstudio" 

            cd $TARGET_DIR
            
            # Reset and Pull latest code
            git fetch origin master
            git reset --hard origin/master
            
            # Install backend dependencies
            cd server
            npm ci || npm install
            
            # Restart backend using PM2
            pm2 restart ssstudio-backend || pm2 start index.js --name "ssstudio-backend"
            
            echo "Backend Deployment to Hostinger completed successfully!"
